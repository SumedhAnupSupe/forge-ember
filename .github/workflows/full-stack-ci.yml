name: Full Stack CI

on:
  push:
    branches:
      - main
      - feature/full-stack-improvements
  pull_request:
    paths:
      - "forge/**"
      - "backend/**"
      - "ember/posto-—-elegant-mail-client/**"
      - ".github/workflows/**"
      - "docker-compose.yml"
      - "Dockerfile*"

permissions:
  contents: read

concurrency:
  group: full-stack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: FORGE build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libargon2-dev
      - name: Configure
        run: cmake -S forge -B build/forge -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: timeout 180s cmake --build build/forge --clean-first --parallel 2
      - name: Test
        run: ctest --test-dir build/forge --output-on-failure --verbose --timeout 30
      - name: API smoke test
        run: timeout 120s bash forge/tests/api_smoke.sh

  ember:
    name: EMBER lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Install dependencies
        run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q

  posto:
    name: POSTO typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ember/posto-—-elegant-mail-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: npm
          cache-dependency-path: ember/posto-—-elegant-mail-client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript checks
        run: npm run lint
      - name: Production build
        run: npm run build
