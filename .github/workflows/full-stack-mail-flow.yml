name: Full-stack mail flow

on:
  push:
    branches: [main, "feat/ember-fastapi-backend"]
    paths:
      - "forge/**"
      - "ember/backend/**"
      - "ember/posto-—-elegant-mail-client/**"
      - ".github/workflows/full-stack-mail-flow.yml"
  pull_request:
    paths:
      - "forge/**"
      - "ember/backend/**"
      - "ember/posto-—-elegant-mail-client/**"
      - ".github/workflows/full-stack-mail-flow.yml"

jobs:
  mail-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install FORGE system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libargon2-dev curl
      - name: Build FORGE
        run: |
          cmake -S forge -B build/forge
          cmake --build build/forge --clean-first -j2
      - name: Install EMBER backend dependencies
        working-directory: ember/backend
        run: uv sync --extra dev
      - name: Install POSTO dependencies and build frontend
        working-directory: ember/posto-—-elegant-mail-client
        run: |
          npm install
          npm run lint
          npm run build
      - name: Run full two-user mail flow through FastAPI and FORGE
        env:
          FORGE_URL: http://127.0.0.1:18080
          EMBER_URL: http://127.0.0.1:18081
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          FORGE_PID=""
          EMBER_PID=""
          cleanup() {
            [[ -z "$EMBER_PID" ]] || kill "$EMBER_PID" 2>/dev/null || true
            [[ -z "$FORGE_PID" ]] || kill "$FORGE_PID" 2>/dev/null || true
            [[ -z "$EMBER_PID" ]] || wait "$EMBER_PID" 2>/dev/null || true
            [[ -z "$FORGE_PID" ]] || wait "$FORGE_PID" 2>/dev/null || true
            echo "---- FORGE log ----"
            cat "$TMP/forge.log" 2>/dev/null || true
            echo "---- EMBER log ----"
            cat "$TMP/ember.log" 2>/dev/null || true
            rm -rf "$TMP"
          }
          trap cleanup EXIT
          ./build/forge/forge-server --host 127.0.0.1 --port 18080 --data-dir "$TMP/data" >"$TMP/forge.log" 2>&1 &
          FORGE_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS "$FORGE_URL/health" > /dev/null; then break; fi
            if ! kill -0 "$FORGE_PID" 2>/dev/null; then cat "$TMP/forge.log"; exit 1; fi
            sleep 0.25
          done
          curl -fsS "$FORGE_URL/health" > /dev/null
          FORGE_BASE_URL="$FORGE_URL" uv run --directory ember/backend uvicorn app.main:app --host 127.0.0.1 --port 18081 >"$TMP/ember.log" 2>&1 &
          EMBER_PID=$!
          for i in $(seq 1 60); do
            if curl -fsS "$EMBER_URL/health/ready" > /dev/null; then break; fi
            if ! kill -0 "$EMBER_PID" 2>/dev/null; then cat "$TMP/ember.log"; exit 1; fi
            sleep 0.25
          done
          curl -fsS "$EMBER_URL/health/ready" > /dev/null

          request() { curl --silent --show-error --fail-with-body "$@"; }
          register() {
            request -X POST "$EMBER_URL/api/v1/auth/register" -H 'Content-Type: application/json' \
              -d "$1" > "$TMP/register.json"
          }
          login() {
            request -X POST "$EMBER_URL/api/v1/auth/login" -H 'Content-Type: application/json' \
              -d "$1"
          }
          register '{"name":"Alice Integration","email":"alice-flow@example.test","password":"FlowPass123!"}'
          register '{"name":"Bob Integration","email":"bob-flow@example.test","password":"FlowPass123!"}'
          ALICE_LOGIN="$(login '{"email":"alice-flow@example.test","password":"FlowPass123!"}')"
          BOB_LOGIN="$(login '{"email":"bob-flow@example.test","password":"FlowPass123!"}')"
          ALICE_TOKEN="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["token"])' "$ALICE_LOGIN")"
          BOB_TOKEN="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["token"])' "$BOB_LOGIN")"
          ALICE_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["user"]["id"])' "$ALICE_LOGIN")"
          BOB_ID="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["user"]["id"])' "$BOB_LOGIN")"

          # Email lookup must resolve to the second user's real FORGE id.
          LOOKUP="$(request "$EMBER_URL/api/v1/users/lookup?email=bob-flow%40example.test" -H "Authorization: Bearer $ALICE_TOKEN")"
          test "$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$LOOKUP")" = "$BOB_ID"

          # Send Alice -> Bob via EMBER; verify inbox and sent listing.
          SENT_AB="$(request -X POST "$EMBER_URL/api/v1/messages" -H "Authorization: Bearer $ALICE_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"subject\":\"Alice to Bob\",\"body\":\"Persisted through FORGE\",\"recipients\":[{\"user_id\":$BOB_ID,\"type\":\"TO\"}]}")"
          ID_AB="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$SENT_AB")"
          request "$EMBER_URL/api/v1/mailboxes/inbox" -H "Authorization: Bearer $BOB_TOKEN" > "$TMP/bob-inbox.json"
          request "$EMBER_URL/api/v1/mailboxes/sent" -H "Authorization: Bearer $ALICE_TOKEN" > "$TMP/alice-sent.json"
          python3 - "$TMP/bob-inbox.json" "$TMP/alice-sent.json" "$ID_AB" <<'PY'
          import json,sys
          msg_id=int(sys.argv[3])
          inbox=json.load(open(sys.argv[1])); sent=json.load(open(sys.argv[2]))
          assert any(m["id"] == msg_id and m["subject"] == "Alice to Bob" for m in inbox), "Bob inbox missing Alice's message"
          assert any(m["id"] == msg_id and m["subject"] == "Alice to Bob" for m in sent), "Alice sent mailbox missing sent message"
          PY

          # Send Bob -> Alice; verify reciprocal flow and canonical detail.
          SENT_BA="$(request -X POST "$EMBER_URL/api/v1/messages" -H "Authorization: Bearer $BOB_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"subject\":\"Bob to Alice\",\"body\":\"Reply persisted through FORGE\",\"recipients\":[{\"user_id\":$ALICE_ID,\"type\":\"TO\"}]}")"
          ID_BA="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["id"])' "$SENT_BA")"
          request "$EMBER_URL/api/v1/mailboxes/inbox" -H "Authorization: Bearer $ALICE_TOKEN" > "$TMP/alice-inbox.json"
          request "$EMBER_URL/api/v1/mailboxes/sent" -H "Authorization: Bearer $BOB_TOKEN" > "$TMP/bob-sent.json"
          request "$EMBER_URL/api/v1/messages/$ID_BA" -H "Authorization: Bearer $ALICE_TOKEN" > "$TMP/detail.json"
          python3 - "$TMP/alice-inbox.json" "$TMP/bob-sent.json" "$TMP/detail.json" "$ID_BA" <<'PY'
          import json,sys
          msg_id=int(sys.argv[4])
          inbox=json.load(open(sys.argv[1])); sent=json.load(open(sys.argv[2])); detail=json.load(open(sys.argv[3]))
          assert any(m["id"] == msg_id and m["subject"] == "Bob to Alice" for m in inbox), "Alice inbox missing Bob's reply"
          assert any(m["id"] == msg_id and m["subject"] == "Bob to Alice" for m in sent), "Bob sent mailbox missing reply"
          assert detail["id"] == msg_id and detail["body"] == "Reply persisted through FORGE", "message detail mismatch"
          PY

          # Refresh/re-fetch proves the message remains in the persistent database.
          request "$EMBER_URL/api/v1/mailboxes/inbox" -H "Authorization: Bearer $BOB_TOKEN" > "$TMP/bob-inbox-after-refresh.json"
          python3 - "$TMP/bob-inbox-after-refresh.json" "$ID_AB" "$ID_BA" <<'PY'
          import json,sys
          inbox=json.load(open(sys.argv[1])); ids={m["id"] for m in inbox}
          assert int(sys.argv[2]) in ids, "Alice's message disappeared after re-fetch"
          assert int(sys.argv[3]) not in ids, "Bob's own sent message incorrectly appears in Bob's inbox"
          PY

          # Auth failures must not be accepted.
          CODE="$(curl -sS -o "$TMP/unauthorized.json" -w '%{http_code}' "$EMBER_URL/api/v1/mailboxes/inbox")"
          test "$CODE" = "401"
          echo "PASS: registration, login, recipient lookup, bidirectional send/receive, inbox/sent, detail, re-fetch persistence, unauthorized request."
