[project]
name = "ember-backend"
version = "0.1.0"
description = "FastAPI service for POSTO/EMBER backed by FORGE"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "httpx>=0.27.0", "pydantic-settings>=2.4.0", "email-validator>=2.2.0"]

[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
