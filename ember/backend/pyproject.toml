[project]
name = "ember-api"
version = "0.1.0"
description = "FastAPI application backend for POSTO, backed by FORGE"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0", "httpx>=0.27,<1.0", "pydantic-settings>=2.6,<3.0", "uvicorn[standard]>=0.30,<1.0", "email-validator>=2.2,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
